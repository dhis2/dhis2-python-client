[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dhis2-client"
version = "0.3.2"
description = "Synchronous DHIS2 Web API client: dict/JSON in and out, logging, paging, and core resources."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "HISP Centre, University of Oslo" }]
keywords = ["dhis2", "health", "api", "client", "http"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "convertdate>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.6.0",
    "respx>=0.20.2",
    "python-dotenv>=1.0.1",
]
examples = ["matplotlib"]

[project.urls]
Repository = "https://github.com/dhis2/dhis2-python-client"
Changelog = "https://github.com/dhis2/dhis2-python-client/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/dhis2/dhis2-python-client/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dhis2_client = ["py.typed"]
